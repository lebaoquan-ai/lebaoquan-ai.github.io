<!-- Hero Section -->
<section class="hero">
    <h1 class="hero__title">A Fool's Blog</h1>
    <div
        class="hero__typed"
        data-typed-text='["Le Bao Quan", "a Software Developer"]'
        data-typed-options='{"typeSpeed": 100, "deleteSpeed": 50, "pauseDuration": 2000, "loop": true}'
    ></div>
</section>

<!-- Tags Section -->
<section class="tags">
    <div class="tags__container">
        <div class="tags__box">
            <a href="/blog/programming" class="tag tag--programming">
                <span class="tag__icon">&lt;/&gt;</span>
                <span class="tag__name">Programming</span>
            </a>
            <a href="/blog/lifestyle" class="tag tag--lifestyle">
                <span class="tag__icon">⚽</span>
                <span class="tag__name">Lifestyle</span>
            </a>
            <a href="/blog/" class="tag tag--discover">
                <span class="tag__icon">&gt;&gt;</span>
                <span class="tag__name">Discover</span>
            </a>
        </div>
    </div>
</section>

<!-- Featured Posts Section -->
<section class="featured-posts">
    <div class="featured-posts__header">
        <h2 class="featured-posts__title">Featured Posts</h2>
    </div>

    <div class="featured-posts__grid">
        <!-- Featured posts will be dynamically generated here -->
        {{featuredPosts}}
    </div>
</section>

<script src="/assets/js/typed_text.js"></script>
